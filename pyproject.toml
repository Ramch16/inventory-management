[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobapply"
version = "0.1.0"
description = "AI job application automation platform (human-in-the-loop)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "celery>=5.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "authlib>=1.3",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "reportlab>=4.2",
    "jsonschema>=4.22",
    "tenacity>=8.3",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-jsonschema",
]
browser = ["playwright>=1.45", "pytest-playwright>=0.5"]
ai = ["openai>=1.35", "anthropic>=0.30"]

[tool.setuptools.packages.find]
where = [
    "packages/shared",
    "packages/database",
    "packages/ai",
    "packages/resume",
    "packages/jobs",
    "packages/browser",
    "apps/api",
    "apps/workers",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires postgres/redis",
    "browser: requires playwright and the local mock ATS sites",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "A", "C4", "RET", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501", "B017"]
"packages/database/jobapply_db/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = []
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
