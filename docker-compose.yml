# Local development stack. Everything here runs without a cloud account:
# MinIO stands in for S3 and Mailpit captures outbound e-mail.
name: jobapply

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobapply
      POSTGRES_PASSWORD: jobapply
      POSTGRES_DB: jobapply
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobapply"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://jobapply:jobapply@postgres:5432/jobapply
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["storage_data:/app/.storage"]
    command: >
      sh -c "alembic -c packages/database/alembic.ini upgrade head &&
             uvicorn jobapply_api.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://jobapply:jobapply@postgres:5432/jobapply
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["storage_data:/app/.storage"]

  beat:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://jobapply:jobapply@postgres:5432/jobapply
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}
    command: ["celery", "-A", "jobapply_workers.beat", "beat", "--loglevel=INFO"]

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  storage_data:
