<title>Bevnetic POS Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,500;0,600;0,700;1,700;1,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --rail:#13202A; --rail-2:#1B2B36; --rail-ink:#C9D6DD; --rail-muted:#7F95A1;
  --bg:#F2F5F6; --surface:#FFFFFF; --surface-2:#F7F9FA; --ink:#14212A; --muted:#5A6B76; --line:#DCE3E7;
  --accent:#F07A1C; --accent-ink:#B8520A; --accent-soft:#FFF1E4; --violet:#8A3FE0; --violet-soft:#F3EAFE;
  --grad:linear-gradient(100deg,#FF9A2E 0%,#EC5A6E 55%,#8A3FE0 100%);
  --crit:#D63F2F; --crit-soft:#FDECEA; --warn:#D98E0B; --warn-soft:#FDF4E1; --ok:#1E9360; --ok-soft:#E6F6EE; --over:#2C74D6; --over-soft:#E7F0FC;
  --shadow:0 1px 2px rgba(20,33,42,.06),0 6px 20px rgba(20,33,42,.06);
  --display:"Saira","Arial Narrow",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0D161C; --surface:#152129; --surface-2:#1A2831; --ink:#E6EDF0; --muted:#8FA2AD; --line:#26363F;
  --accent:#FF8E3A; --accent-ink:#FFB27A; --accent-soft:#3A2414; --violet:#B07BFF; --violet-soft:#2A1C40;
  --crit:#FF6A57; --crit-soft:#3A1A17; --warn:#F2B13C; --warn-soft:#382A10; --ok:#3CC487; --ok-soft:#13301F; --over:#5C9BFF; --over-soft:#15253D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0D161C; --surface:#152129; --surface-2:#1A2831; --ink:#E6EDF0; --muted:#8FA2AD; --line:#26363F;
  --accent:#FF8E3A; --accent-ink:#FFB27A; --accent-soft:#3A2414; --violet:#B07BFF; --violet-soft:#2A1C40;
  --crit:#FF6A57; --crit-soft:#3A1A17; --warn:#F2B13C; --warn-soft:#382A10; --ok:#3CC487; --ok-soft:#13301F; --over:#5C9BFF; --over-soft:#15253D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:6px;padding:14px 12px;position:sticky;top:0;height:100vh;overflow:auto;
  background-image:radial-gradient(circle at 20% 0%,rgba(255,154,46,.10),transparent 45%),linear-gradient(transparent 0 0);}
.brand{display:flex;align-items:center;gap:8px;padding:2px 4px 12px}
.brand img{width:62px;height:auto;-webkit-mask-image:radial-gradient(ellipse 62% 58% at 55% 50%,#000 60%,transparent 100%);mask-image:radial-gradient(ellipse 62% 58% at 55% 50%,#000 60%,transparent 100%)}
.brand b{font:italic 800 21px/1 var(--display);letter-spacing:.02em;color:#fff}
.brand small{display:block;font:600 9px/1.3 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--rail-muted);margin-top:4px}
.navlabel{font:700 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--rail-muted);padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--rail-ink);text-decoration:none;font-weight:600;position:relative}
.nav:hover{background:var(--rail-2)}
.nav.on{background:linear-gradient(90deg,rgba(255,154,46,.20),rgba(138,63,224,.12));color:#fff}
.nav.on svg{color:#FFA350}
.nav .cnt{margin-left:auto;font:600 11px/1 var(--mono);background:#E8503A;color:#fff;border-radius:10px;padding:3px 6px}
.railfoot{margin-top:auto;border-top:1px solid #243642;padding:12px 6px 4px;font-size:12px;color:var(--rail-muted)}
.railfoot strong{color:#fff;display:block;font-size:13px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top h1{font:700 22px/1.1 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
.top .sub{color:var(--muted);font-size:12px}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.pill.off .dot{background:var(--crit);box-shadow:0 0 0 3px var(--crit-soft)}
.pill.off{border-color:var(--crit);color:var(--crit)}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);position:relative}
.iconbtn .badge{position:absolute;top:-5px;right:-5px;background:#E8503A;color:#fff;font:600 10px/1 var(--mono);padding:3px 5px;border-radius:9px}
.iconbtn[aria-pressed="true"]{background:var(--violet-soft);border-color:var(--violet);color:var(--violet)}
.content{padding:22px 24px 40px;display:flex;flex-direction:column;gap:18px;max-width:1440px;width:100%}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h2,.h2{font:700 16px/1.2 var(--display);margin:0;letter-spacing:.01em}
.cardhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cardhead .spacer{flex:1}
.muted{color:var(--muted)}
.eyebrow{font:700 10.5px/1 var(--body);letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;font-weight:700;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.grad{background:var(--grad);border:0;color:#fff}
.btn.ghost{background:transparent}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.sm{padding:5px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.over{background:var(--over-soft);color:var(--over)}
.chip.ai{background:var(--violet-soft);color:var(--violet)} .chip.plain{border-color:var(--line);color:var(--muted)}
.chip.age{background:var(--ink);color:var(--surface);font-family:var(--mono);font-size:10.5px;padding:2px 6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 10px;font-weight:700;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--surface)}
table{width:100%;border-collapse:collapse}
th{font:700 10.5px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.r{text-align:right}

/* ---------- wireframe notes mode ---------- */
.spec{display:none}
body.notes .spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;border:1.5px dashed var(--violet);background:var(--violet-soft);border-radius:12px;padding:14px 16px}
.spec h3{grid-column:1/-1;margin:0;font:700 13px/1 var(--display);color:var(--violet);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.spec div{font-size:12.5px}
.spec b{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--violet);margin-bottom:3px}
.spec ul{margin:0;padding-left:16px}
body.notes [data-note]{outline:1.5px dashed var(--violet);outline-offset:3px;position:relative}
body.notes [data-note]::after{content:attr(data-note);position:absolute;top:-10px;right:8px;background:var(--violet);color:#fff;font:700 10px/1 var(--mono);padding:4px 6px;border-radius:4px;z-index:5;pointer-events:none;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- command center ---------- */
.hello{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font:700 23px/1.15 var(--display);white-space:nowrap;letter-spacing:.01em}
.kpi .d{font-size:12px;font-weight:700}
.kpi .d.up{color:var(--ok)} .kpi .d.dn{color:var(--crit)}
.kpi.wide{grid-column:span 2}
.spark{width:100%;height:34px;display:block}
.assistant{background:var(--rail);color:#E7EEF2;border-radius:14px;padding:18px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.assistant::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0%,rgba(236,90,110,.28),transparent 45%),radial-gradient(circle at 0% 100%,rgba(138,63,224,.22),transparent 50%);pointer-events:none}
.assistant>*{position:relative}
.assistant .quote{font:600 italic 17px/1.35 var(--display);color:#fff;text-wrap:balance}
.prio{display:flex;flex-direction:column;gap:6px}
.prio button{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:9px 11px;color:#E7EEF2}
.prio button:hover{background:rgba(255,255,255,.10)}
.prio .sev{width:8px;height:28px;border-radius:4px;flex:none}
.prio .go{margin-left:auto;color:#FFA350;font-size:12px;font-weight:700;white-space:nowrap}
.hourly{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.bars{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:8px}
.bars div{flex:1;border-radius:4px 4px 0 0;background:color-mix(in srgb,var(--accent) 35%,var(--surface-2));position:relative}
.bars div.now{background:var(--accent)}
.bars div.fc{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--violet) 30%,transparent) 0 4px,transparent 4px 8px);border:1px dashed var(--violet);border-bottom:0}
.barlbl{display:flex;gap:4px;font:500 10px/1 var(--mono);color:var(--muted);margin-top:6px}
.barlbl span{flex:1;text-align:center}
.mix li{display:grid;grid-template-columns:90px 1fr 60px;gap:8px;align-items:center;padding:5px 0}
.mix ul{list-style:none;margin:0;padding:0}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--grad)}

/* ---------- register ---------- */
.reg{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
.scanbar{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 16px;box-shadow:0 1px 2px rgba(20,33,42,.04)}
.scanbar input{flex:1;border:0;outline:0;background:transparent;padding:6px 0;min-width:0;font-size:15px}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;display:inline-flex;gap:8px;align-items:center;color:var(--muted)}
.cats button .n{font:600 11px/1 var(--mono);background:var(--surface-2);color:var(--muted);border-radius:8px;padding:3px 6px}
.cats button.on{background:var(--rail);border-color:var(--rail);color:#fff}
.cats button.on .n{background:rgba(255,255,255,.14);color:#FFA350}
.plu{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:40px 16px;padding-top:30px}
.prod{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:end;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:0 14px 14px;min-height:112px;position:relative;transition:transform .15s,box-shadow .15s,border-color .15s}
.prod:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:0 10px 24px -12px rgba(240,122,28,.45);transform:translateY(-2px)}
.prod:active{transform:scale(.98)}
.prod .art{margin-top:-34px;height:124px;display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 8px 8px rgba(20,33,42,.18));transition:transform .2s}
.prod:hover .art{transform:translateY(-4px) rotate(-3deg)}
.prod .art svg{height:100%;width:auto;overflow:visible}
.prod .info{display:flex;flex-direction:column;gap:2px;padding-top:12px;min-width:0}
.prod .nm{font-weight:700;font-size:14.5px;line-height:1.2}
.prod .meta{font:500 11.5px/1.3 var(--body);color:var(--muted)}
.prod .price{font:800 23px/1 var(--display);color:var(--accent);margin-top:8px;display:flex;align-items:baseline;gap:8px}
.prod .price small{font:600 11px/1 var(--body);color:var(--muted)}
.prod .price small.low{color:var(--warn)}
.stockpill{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;margin-top:6px;font:700 11.5px/1 var(--body);border-radius:7px;padding:4px 8px}
.stockpill svg{width:12px;height:12px}
.stockpill b{font-family:var(--mono)}
.stockpill.ok{background:var(--ok-soft);color:var(--ok)} .stockpill.low{background:var(--warn-soft);color:var(--warn)} .stockpill.out{background:var(--crit-soft);color:var(--crit)}
.prod .badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px;min-height:18px}
.prod.out .art{filter:grayscale(1) opacity(.45)}
.prod.out .price{color:var(--muted)}
.prod.lock{opacity:.5}
.prod.lock .art{filter:grayscale(.8)}
.otag{font:700 10px/1 var(--body);background:var(--ok-soft);color:var(--ok);border-radius:6px;padding:4px 6px}
.stag{font:700 10px/1 var(--body);background:var(--crit-soft);color:var(--crit);border-radius:6px;padding:4px 6px}
.ticket{position:sticky;top:76px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);max-height:calc(100vh - 96px)}
.ticket header{padding:18px 18px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ticket header .h2{white-space:nowrap}
.ticket header .spacer{flex:1}
.ticket header .h2{font-size:19px}
.lines{overflow:auto;flex:1;min-height:120px;padding:0 6px}
.line{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .thumb{height:56px;display:flex;justify-content:center}
.line .thumb svg{height:100%;width:auto;overflow:visible}
.line .ln{font-weight:700;font-size:13.5px;line-height:1.25}
.line .lm{font-size:11.5px;color:var(--muted)}
.line .lp{font:700 14px/1 var(--mono);color:var(--accent);margin-top:4px}
.qty{display:flex;align-items:center;gap:8px;font:700 14px var(--mono)}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);padding:0;line-height:1;font-size:15px;color:var(--muted)}
.qty button:hover{border-color:var(--accent);color:var(--accent)}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.pairs{margin:4px 16px 0;padding:10px 12px;border-radius:14px;background:var(--violet-soft);display:flex;flex-direction:column;gap:8px}
.pair{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.pair .thumb svg{height:34px;width:auto}
.pair small{display:block;color:var(--muted);font-size:11px}
.clockban{display:flex;gap:10px;align-items:center;border-radius:12px;padding:11px 14px;font-weight:600;font-size:13px}
.clockban.soon{background:var(--warn-soft);color:var(--warn)}
.clockban.locked{background:var(--crit-soft);color:var(--crit)}
.idgate{margin:10px 16px 0;border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:12.5px;font-weight:600}
.idgate.need{background:var(--warn-soft);color:var(--warn)}
.idgate.ok{background:var(--ok-soft);color:var(--ok)}
.totals{padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:13px;border-top:1px solid var(--line);background:var(--surface-2)}
.totals .grand{font:700 26px/1.1 var(--display);padding-top:8px;border-top:1px dashed var(--line);margin-top:4px}
.paybar{padding:0 18px 18px;background:var(--surface-2);display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.regswitch{display:flex;width:100%;margin:12px 0}
.regswitch button{flex:1;display:inline-flex;gap:6px;align-items:center;justify-content:center;padding:9px 8px;font-size:13px}
.regswitch .i{width:15px;height:15px}
.reg.show-order{grid-template-columns:1fr}
.reg.show-order > section{display:none!important}
.reg.show-order > .ticket{position:static;max-height:none;width:100%;max-width:780px;margin:0 auto}
.reg.show-products .regbrowse{display:none}
.paybar .btn.on{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.offerrow{color:var(--ok)}
.saved{grid-column:1/-1;justify-self:start;margin-top:4px}
.otag{font:700 10px/1 var(--body);background:var(--ok-soft);color:var(--ok);border-radius:4px;padding:3px 5px}
.ldisc{font:600 11px/1 var(--mono);color:var(--ok)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:700}
.quick button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700}
.field input,.field select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:500;font-size:14px;min-width:0;width:100%}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.comply{border-radius:10px;padding:10px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.comply span{display:flex;gap:8px;align-items:center}
.comply .bad{color:var(--crit);font-weight:700} .comply .good{color:var(--ok)}
.pinbox{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-weight:600;font-size:13px;flex-wrap:wrap}
.pinbox input{width:110px;letter-spacing:.4em;font-family:var(--mono);text-align:center;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stats div{background:var(--surface);padding:14px 16px}
.stats b{display:block;font:700 24px/1.15 var(--display)}
.stats small{color:var(--muted);font-size:12px}
.offgrid{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.offer{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.offer.dim{opacity:.6}
.offer h3{margin:0;font:700 15px/1.2 var(--display)}
.offer .rule{font-size:13px}
.offer .foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line);font-size:12px;flex-wrap:wrap}
.offer .foot .spacer{flex:1}
.sugg{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sugg:last-child{border-bottom:0}
.sugg p{margin:0;font-weight:700;font-size:13px}
.sugg small{grid-column:1;color:var(--muted);font-size:12px}
.sugg button{grid-row:1/3;grid-column:2}
.receipt{font:500 12px/1.6 var(--mono);background:#FBFAF6;color:#2B2B2B;border-radius:6px;padding:12px;border:1px solid #E6E1D3}
.receipt .g{color:#1E9360}
.dmggrid{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
.photo{border:1.5px dashed var(--line);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12.5px;cursor:pointer}
.photo img{width:54px;height:54px;object-fit:cover;border-radius:6px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:34px;height:36px;font-weight:700}
.stepper span{min-width:40px;text-align:center;font:700 14px var(--mono)}
.claim{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.claim:last-child{border-bottom:0}
.dlog td{font-size:13px;padding:8px 10px}
.dlog td:first-child,.dlog td:nth-child(5),.dlog td:last-child{white-space:nowrap}
.claim .flow{grid-column:1/-1;display:flex;gap:4px}
.claim .flow i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.claim .flow i.on{background:var(--ok)}
.clock{position:relative;height:38px;border-radius:10px;overflow:hidden;display:flex;background:var(--crit-soft)}
.clock i{display:block;height:100%}
.clock i.ok{background:color-mix(in srgb,var(--ok) 22%,var(--surface))}
.clock .now{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}
.clock .now b{position:absolute;top:6px;left:8px;white-space:nowrap;font:700 11px/1 var(--mono);background:var(--ink);color:var(--surface);padding:4px 6px;border-radius:5px}
.clockax{display:flex;justify-content:space-between;font:500 10.5px/1 var(--mono);color:var(--muted);margin-top:6px}
.hero{border-radius:18px;padding:20px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.hero.ok{background:var(--ok-soft);color:var(--ok)} .hero.soon{background:var(--warn-soft);color:var(--warn)} .hero.locked{background:var(--crit-soft);color:var(--crit)}
.hero .big{font:800 italic 28px/1.1 var(--display)}
.hero .sub{color:var(--ink);font-size:13px;margin-top:4px}
.rule{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.rule:last-child{border-bottom:0}
.rule div{flex:1}
.rule small{display:block;color:var(--muted);font-size:11.5px}
.compgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.score{font:700 13px/1 var(--mono);padding:4px 8px;border-radius:6px}
.rel h3{margin:0;font:700 17px/1.2 var(--display)}
.swap{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.swapcard{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.swapcard .art{height:110px}
.swapcard .art svg{height:100%;width:auto}
.swapcard.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.why{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;font-size:13px}
.why li{display:flex;gap:8px;align-items:center}
.why svg{color:var(--ok)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.vcard.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 12px 28px -16px rgba(240,122,28,.6)}
.vcard.skip{opacity:.8}
.vcard h3{margin:0;font:700 16px/1.2 var(--display)}
.vcard .deal{border-radius:10px;padding:8px 10px;background:var(--violet-soft);color:var(--violet);font-weight:700;font-size:12.5px;display:flex;gap:6px;align-items:center}
.vcard .deal.none{background:var(--surface-2);color:var(--muted)}
.vcard dl{display:grid;grid-template-columns:1fr auto;gap:5px 10px;margin:0;font-size:12.5px}
.vcard dt{color:var(--muted)} .vcard dd{margin:0;font-family:var(--mono);font-weight:600;text-align:right}
.vcard .eff{font:800 26px/1 var(--display);color:var(--accent)}
.vcard .eff small{font:600 12px var(--body);color:var(--muted)}
.vcard .trap{border-radius:10px;padding:8px 10px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600}
.meta3{display:flex;gap:6px;flex-wrap:wrap}
.buyhead{display:grid;grid-template-columns:70px 1fr auto;gap:18px;align-items:center}
.buyhead .field{align-items:flex-end}
.buyhead>*{min-width:0}
.buyhead .chip{white-space:normal}
.pohead{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.pogrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.verdict2{border-radius:16px;padding:16px 18px;background:var(--rail);color:#E7EEF2;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;position:relative;overflow:hidden}
.verdict2::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0%,rgba(255,154,46,.25),transparent 55%);pointer-events:none}
.verdict2>*{position:relative}
.verdict2 b.big{font:800 italic 22px/1.2 var(--display);color:#fff;display:block}
.paybar .btn{padding:12px}
.paybar .big{grid-column:1/-1;font-size:16px;padding:16px;border-radius:14px;background:var(--grad);border:0}
.offbanner{display:flex;gap:10px;align-items:center;background:var(--crit-soft);color:var(--crit);border:1px solid color-mix(in srgb,var(--crit) 35%,transparent);border-radius:10px;padding:10px 14px;font-weight:600;font-size:13px}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,14,18,.58);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:16px;width:min(860px,100%);max-height:calc(100% - 20px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header h2{font:700 19px/1 var(--display);margin:0}
.modal header .spacer{flex:1}
.modal .body{padding:20px;display:grid;gap:20px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.idwrap{grid-template-columns:1fr 1fr}
.idcard{aspect-ratio:1.586;max-width:100%;border-radius:12px;padding:14px;background:linear-gradient(135deg,#E9EEF4,#CFD9E3);color:#1C2A36;position:relative;overflow:hidden;display:grid;grid-template-columns:80px 1fr;gap:10px;align-content:start;font-size:11px}
.idcard .ph{width:80px;height:96px;border-radius:6px;background:linear-gradient(#AAB8C4,#8C9DAC)}
.idcard .st{grid-column:1/-1;font:800 italic 13px/1 var(--display);letter-spacing:.1em;color:#2C4A67}
.idcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
.idcard dt{color:#5A6B7A;font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.idcard dd{margin:0;font-family:var(--mono);font-weight:600}
.laser{position:absolute;left:0;right:0;height:2px;background:#FF3B3B;box-shadow:0 0 12px 2px #FF3B3B;top:10%;animation:scan 1.3s ease-in-out infinite alternate}
@keyframes scan{to{top:88%}}
.pdf417{height:54px;border-radius:6px;background:#fff;padding:6px;display:flex;gap:1px;overflow:hidden;margin-top:10px}
.pdf417 i{flex:1;background:#111}
.checks{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:13px}
.checks li .st{margin-left:auto;font:600 11px/1 var(--mono)}
.tick{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--line);color:#fff}
.tick.ok{background:var(--ok)} .tick.bad{background:var(--crit)} .tick.run{background:transparent;border:2px solid var(--accent);border-top-color:transparent;animation:spin .7s linear infinite}
.tick svg{width:12px;height:12px;stroke-width:3}
@keyframes spin{to{transform:rotate(360deg)}}
.agebig{font:800 italic 44px/1 var(--display)}
.verdict{border-radius:12px;padding:14px;display:flex;gap:14px;align-items:center}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.bad{background:var(--crit-soft);color:var(--crit)}
.term{border-radius:18px;background:#1A1F24;color:#fff;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;max-width:260px;margin-inline:auto;width:100%}
.term .scr{background:#0E1418;border-radius:10px;width:100%;padding:18px 12px;display:flex;flex-direction:column;gap:6px;align-items:center}
.term .amt{font:700 30px/1 var(--mono)}
.nfc{width:64px;height:64px;border-radius:50%;border:2px solid #FFA350;display:grid;place-items:center;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,163,80,.5)}100%{box-shadow:0 0 0 18px rgba(255,163,80,0)}}
.methods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.methods button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:12px}
.methods button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.cashgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* ---------- inventory heat map ---------- */
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lg{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.lg .n{font:700 28px/1 var(--display)}
.lg small{color:var(--muted);font-size:11.5px}
.lg.on{border-color:currentColor}
.lg.crit{color:var(--crit)} .lg.warn{color:var(--warn)} .lg.ok{color:var(--ok)} .lg.over{color:var(--over)}
.lg .t{color:var(--ink);font-weight:700;display:flex;align-items:center;gap:6px}
.lg .t i{width:10px;height:10px;border-radius:3px;background:currentColor}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));grid-auto-rows:122px;grid-auto-flow:dense;gap:6px}
.tile{border:0;border-radius:8px;padding:8px 9px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink);transition:opacity .2s,transform .12s;overflow:hidden}
.tile:hover{transform:scale(1.02)}
.tile.big{grid-column:span 2;grid-row:span 2}
.tile.wide{grid-column:span 2}
.tile .tn{font-weight:700;font-size:12px;line-height:1.2}
.tile .tv{font:600 11px/1.2 var(--mono);opacity:.85}
.tile .tm{display:flex;flex-direction:column;gap:3px;font:500 11px/1.25 var(--body)}
.tile .tm span{display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tm svg{width:12px;height:12px;flex:none;opacity:.7}
.tile .tm b{font-family:var(--mono)}
.tile.big .tm{font-size:12.5px;gap:5px}
.tile.big .tm svg{width:14px;height:14px}
.invlist td{font-size:13px;white-space:nowrap}
.invlist td:first-child{white-space:normal;min-width:150px}
.invlist tr{cursor:pointer}
.invlist tr:hover td{background:var(--surface-2)}
.invlist tr.sel td{background:var(--accent-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.dot.crit{background:var(--crit)} .dot.warn{background:var(--warn)} .dot.ok{background:var(--ok)} .dot.over{background:var(--over)}
.tile.big .tn{font-size:15px}
.tile.crit{background:color-mix(in srgb,var(--crit) 26%,var(--surface))} .tile.warn{background:color-mix(in srgb,var(--warn) 26%,var(--surface))}
.tile.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface))} .tile.over{background:color-mix(in srgb,var(--over) 22%,var(--surface))}
.tile.dim{opacity:.18}
.tile.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.insight{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.insight div{background:var(--surface);padding:14px 16px}
.insight b{display:block;font:700 30px/1 var(--display);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.invgrid{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.actions{display:flex;flex-direction:column}
.act{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.act .ic.crit{background:var(--crit-soft);color:var(--crit)} .act .ic.warn{background:var(--warn-soft);color:var(--warn)} .act .ic.over{background:var(--over-soft);color:var(--over)}
.act p{margin:0;font-size:13px;font-weight:600}
.act small{color:var(--muted);font-size:11.5px}
.detail dl{display:grid;grid-template-columns:1fr auto;gap:6px 10px;margin:10px 0 0;font-size:13px}
.detail dd{margin:0;font-family:var(--mono);text-align:right}
.detail dt{color:var(--muted)}

/* ---------- forecast ---------- */
.fcgrid{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:500 10.5px var(--mono)}
.drivers{display:flex;flex-direction:column;gap:8px}
.drv{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;font-size:13px}
.drv .ic{width:28px;height:28px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.drv b{font:600 12px/1 var(--mono)}
.drv b.up{color:var(--ok)} .drv b.dn{color:var(--crit)}
.reco{border-radius:14px;padding:16px;background:var(--rail);color:#E7EEF2;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.reco::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0%,rgba(255,154,46,.25),transparent 55%);pointer-events:none}
.reco>*{position:relative}
.reco .big{font:800 italic 32px/1 var(--display);color:#fff}
.reco ul{margin:0;padding-left:18px;font-size:12.5px;color:#B9C8D0}
.skus{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- invoices ---------- */
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;counter-reset:s}
.step{display:flex;flex-direction:column;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted)}
.step i{height:5px;border-radius:3px;background:var(--line)}
.step.done i{background:var(--ok)} .step.cur i{background:var(--grad)} .step.cur{color:var(--ink)}
.step span{font:600 10px/1 var(--mono)}
.invwrap{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.paper{background:#FBFAF6;color:#2B2B2B;border-radius:6px;padding:16px;font:500 10px/1.5 var(--mono);box-shadow:var(--shadow);transform:rotate(-1.2deg);position:relative;border:1px solid #E6E1D3}
.paper h4{margin:0 0 4px;font:700 13px/1 var(--body);letter-spacing:.03em}
.paper .row{display:grid;grid-template-columns:1fr 26px 46px;gap:4px;border-bottom:1px dotted #CFC8B6;padding:2px 0}
.paper .hl{position:absolute;border:2px solid var(--violet);border-radius:4px;background:rgba(138,63,224,.08)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12.5px;background:var(--surface)}
.conf{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--mono)}
.conf i{width:34px;height:5px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.conf i b{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.var-up{color:var(--crit);font-weight:700} .var-dn{color:var(--ok);font-weight:700}
.rowact{display:flex;gap:4px}
.rowact button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.rowact button.on-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.rowact button.on-bad{background:var(--crit);border-color:var(--crit);color:#fff}
tr.rej td{opacity:.45;text-decoration:line-through}
tr.rej td:last-child{opacity:1;text-decoration:none}

/* ---------- alerts ---------- */
.alerts{display:flex;flex-direction:column;gap:10px}
.alert{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.alert .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.alert h3{margin:0;font:700 14px/1.2 var(--body)}
.alert p{margin:3px 0 0;color:var(--muted);font-size:13px}
.alert .when{font:500 11px/1 var(--mono);color:var(--muted)}
.alert.done{opacity:.5}
.alert .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* ---------- customers ---------- */
.cust{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.member{display:flex;flex-direction:column;gap:12px}
.avatar{width:52px;height:52px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;font:800 italic 20px var(--display)}
.tier{background:var(--rail);color:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.tier .pts{font:700 26px/1 var(--mono)}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.12)} .prog i{display:block;height:100%;border-radius:3px;background:var(--grad)}
.segs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.segcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.segcard .n{font:700 22px/1 var(--display)}
.phone{width:240px;max-width:100%;border-radius:26px;border:8px solid #1A1F24;background:#EEF1F3;padding:14px 10px;display:flex;flex-direction:column;gap:8px;color:#1C2A36;margin-inline:auto}
.bubble{background:#fff;border-radius:14px 14px 14px 4px;padding:10px;font-size:12px;line-height:1.4}

/* ---------- devices ---------- */
.devgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.stars{color:var(--accent);letter-spacing:1px;font-size:13px}
.stars s{color:var(--line);text-decoration:none}
.qrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.qrow:last-child{border-bottom:0}
.limit{display:flex;flex-direction:column;gap:6px}
.limit .meter i{background:var(--warn)}
.toggle{width:38px;height:22px;border-radius:11px;background:var(--line);border:0;position:relative;padding:0;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-pressed="true"]{background:var(--ok)}
.toggle[aria-pressed="true"]::after{left:19px}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.setrow:last-child{border-bottom:0}
.setrow div{flex:1}
.setrow small{display:block;color:var(--muted);font-size:11.5px}

/* ---------- toast ---------- */
.toast[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:10px;padding:11px 16px;font-weight:700;font-size:13px;z-index:60;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ---------- shelf optimizer ---------- */
.sw{display:grid;grid-template-columns:150px 30px 150px 1fr 210px;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.sw.done{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.sw .pk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.sw .pk .art{height:96px;display:flex;justify-content:center;filter:drop-shadow(0 6px 6px rgba(20,33,42,.16))}
.sw .pk .art svg{height:100%;width:auto}
.sw .pk.old .art{filter:grayscale(1) opacity(.5)}
.sw .pk b{font-size:13px;line-height:1.25}
.sw .pk small{font-size:11.5px;color:var(--muted);line-height:1.35}
.sw .pk small.bad{color:var(--crit);font-weight:700}
.sw .pk small.good{color:var(--ok);font-weight:700}
.sw .arrow{color:var(--accent);justify-self:center}
.sw .act{display:flex;flex-direction:column;gap:8px;border-left:1px solid var(--line);padding-left:16px}
.sw .gain{font:800 22px/1 var(--display);color:var(--ok)}
.sw .gain small{font:600 11.5px var(--body);color:var(--muted)}
.sw .clear{font-size:12px;border-radius:8px;padding:6px 8px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.best td{vertical-align:middle}
.margins{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.margins label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.margins input{width:100%;border:0;background:transparent;font:700 22px/1 var(--display);color:var(--ink);padding:0}
.margins .pct{display:flex;align-items:baseline;gap:2px}
.pricetbl td{vertical-align:middle}
.pricetbl .up{color:var(--crit);font-weight:700} .pricetbl .dn{color:var(--ok);font-weight:700}
.pricetbl input[type=number]{width:84px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:600 13px var(--mono);color:var(--ink)}
.pricetbl input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.pricetbl small{display:block;color:var(--muted);font-size:11px}
.pricetbl .tgt{display:flex;align-items:center;gap:4px;font:600 13px var(--mono)}
.pricetbl .tgt input{width:58px}
.pricetbl .src{display:inline-block;margin-top:3px;font:700 10px/1 var(--body);padding:3px 6px;border-radius:5px}
.src.product{background:var(--violet-soft);color:var(--violet)} .src.group{background:var(--over-soft);color:var(--over)} .src.category{background:var(--surface-2);color:var(--muted)}
.mrule{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.mrule div{flex:1;min-width:0}
.mrule small{display:block;color:var(--muted);font-size:11.5px}
.mrule .pct{font:700 15px var(--mono)}
.pricetbl tr.applied td{background:var(--ok-soft)}
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tag{border:2px solid #1C2A36;border-radius:6px;padding:8px 10px;background:#FFFFFF;color:#1C2A36;display:flex;flex-direction:column;gap:2px;font-family:var(--body)}
.tag .tn{font-weight:800;font-size:12px;line-height:1.2}
.tag .tp{font:800 28px/1 var(--display);color:#C2410C}
.tag .tu{font-size:10px;color:#5A6B76}
.tag .tb{height:16px;display:flex;gap:1px;margin-top:4px}
.tag .tb i{flex:1;background:#111}
.best .thumb{height:40px;display:inline-flex;width:24px;justify-content:center;vertical-align:middle}
.best .thumb svg{height:100%;width:auto}
.best .rank{font:800 italic 18px/1 var(--display);color:var(--muted);width:30px}
.best tr:nth-child(-n+3) .rank{color:var(--accent)}
/* ---------- guided demo ---------- */
.tour{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100% - 32px));background:var(--rail);color:#E7EEF2;border-radius:18px;padding:16px 18px;z-index:70;box-shadow:0 24px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:10px;border:1px solid #2A3B47}
.tour .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.tour .bar i{display:block;height:100%;background:var(--grad);transition:width .3s}
.tour .ttop{display:flex;align-items:center;gap:8px;font:600 11px/1 var(--mono);color:#8FA2AD}
.tour .ttop .spacer{flex:1}
.tour h3{margin:0;font:800 italic 19px/1.2 var(--display);color:#fff;text-wrap:balance}
.tour p{margin:0;font-size:13.5px;line-height:1.5;color:#C9D6DD}
.tour .say{font:700 10px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:#FFA350}
.tour .acts{display:flex;gap:8px;align-items:center}
.tour .acts .spacer{flex:1}
.tour .btn{background:transparent;color:#E7EEF2;border-color:#3A4B56}
.tour .btn.primary{background:var(--grad);border:0;color:#fff}
.tour .x{background:transparent;border:0;color:#8FA2AD;padding:2px;display:grid;place-items:center}
.tour-hl{outline:3px solid #FF9A2E!important;outline-offset:5px;animation:hl 1.6s ease-in-out infinite}
@keyframes hl{50%{outline-color:rgba(236,90,110,.9);outline-offset:9px}}
.btn.demo{background:var(--grad);border:0;color:#fff}
/* grid columns may shrink below their content; wide tables scroll inside .tablewrap */
.reg>*,.invgrid>*,.fcgrid>*,.invwrap>*,.cust>*,.offgrid>*,.dmggrid>*,.compgrid>*,.pogrid>*,.devgrid>*,.hello>*,.hourly>*,.vgrid>*{min-width:0}
.campaign{display:grid;grid-template-columns:1fr 240px;gap:20px;align-items:center}
/* ---------- responsive ---------- */
@media (max-width:1180px){
  .rpgrid{grid-template-columns:1fr 1fr}
  .rpgrid .wide{grid-column:1/-1}
  .sw{grid-template-columns:1fr 30px 1fr}
  .sw .why,.sw .act{grid-column:1/-1}
  .sw .act{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:12px}
  .reg{grid-template-columns:minmax(0,1fr) 330px}
  .invgrid,.fcgrid,.invwrap,.cust,.offgrid,.dmggrid,.compgrid,.pogrid{grid-template-columns:1fr}
  .verdict2{grid-template-columns:1fr}
  .buyhead{grid-template-columns:56px 1fr}
  .buyhead .field{grid-column:1/-1;align-items:flex-start}
  .vgrid{grid-template-columns:1fr}
  .campaign{grid-template-columns:1fr}
  .hello,.hourly,.devgrid{grid-template-columns:1fr}
}
@media (max-width:820px){
  .reg{grid-template-columns:1fr}
  .reg .ticket{position:static;max-height:none}
  .reg.show-products > .ticket{display:none!important}
  .tour{right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));padding:12px 14px;gap:8px}
  .tour p{font-size:12.5px}
  .tour-hl{scroll-margin-top:12px}
  .btn.demo span{display:none}
  .app{grid-template-columns:1fr}
  .rail{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;z-index:40;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;gap:2px}
  .brand,.navlabel,.railfoot{display:none}
  .nav{flex-direction:column;gap:3px;font-size:10px;padding:6px 8px;min-width:64px}
  .nav .cnt{position:absolute;top:2px;right:6px;margin:0;padding:2px 4px;font-size:9px}
  .content{padding:16px 16px 100px}
  .top{padding:10px 16px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .legend,.insight,.stats,.margins{grid-template-columns:repeat(2,1fr)}
  .rpgrid{grid-template-columns:1fr}
  .rpgrid .wide{grid-column:auto}
  .frow{grid-template-columns:1fr}
  .sw{grid-template-columns:1fr 26px 1fr}
  .sw .why,.sw .act{grid-column:1/-1}
  .sw .act{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:12px}
  .hero{grid-template-columns:1fr}
  .swap{grid-template-columns:1fr}
  .plu{grid-template-columns:1fr 1fr;gap:40px 10px}
  .prod{grid-template-columns:1fr;padding:0 12px 12px}
  .prod .art{height:104px}
  .steps{grid-template-columns:repeat(4,1fr);row-gap:10px}
  .idwrap{grid-template-columns:1fr}
  .methods,.cashgrid{grid-template-columns:repeat(2,1fr)}
  .alert{grid-template-columns:40px 1fr}
  .alert .acts{grid-column:1/-1;justify-content:flex-start}
  .top .sub{display:none}
}

.rpgrid .wide{grid-column:span 2}

.kv .tot{font-weight:800;color:var(--ink);border-top:1px solid var(--line);padding-top:6px}
.kv .neg{color:var(--crit)}
.rpbar{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.chartsvg{width:100%;height:auto;display:block}
.chartsvg text{fill:var(--muted);font:500 10.5px var(--mono)}

.sheet.receipt .foot{flex-direction:column;align-items:center;border-top:1px dashed #111}
.rpgrid>*{min-width:0}

.cdtot{background:rgba(255,255,255,.05);padding:2cqw 3cqw;display:flex;flex-direction:column;gap:1cqw;font-size:2.3cqw}
.cdgrand{font:800 4.4cqw/1.1 var(--display);padding-top:1cqw;border-top:1px solid rgba(255,255,255,.15)}
.cdid{background:#F2B13C;color:#1C1300;border-radius:1.2cqw;padding:1cqw 1.6cqw;font-weight:800;display:flex;gap:1cqw;align-items:center;margin-top:auto}
.cdbtn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:inherit;border-radius:1.6cqw;padding:1.2cqw 2cqw;font:700 2.1cqw var(--body);display:inline-flex;gap:1cqw;align-items:center;justify-content:center;cursor:pointer}
.cdtot .cdbtn{margin-top:auto}
.cdid + .cdbtn{margin-top:0}
.cdbtn.hint{border-color:#FFA350;background:rgba(255,163,80,.18)}
.cdbtn small{opacity:.7;font-size:.85em}
.cdpay{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;padding:3cqw;text-align:center}
.cdpay small{font-size:2.2cqw;opacity:.7;text-transform:uppercase;letter-spacing:.15em}
.cdbig{font:800 11cqw/1 var(--display)}
.cdtap{font-size:2.8cqw;display:flex;gap:1.2cqw;align-items:center;color:#FFA350;font-weight:800}
.cdpay h3{margin:0;font:800 4.2cqw/1.1 var(--display)}
.cdpay p{margin:0;font-size:2cqw;max-width:80%}
.cdok{color:#6EE0A8;font-weight:800;font-size:3cqw;display:flex;gap:1cqw;align-items:center}
.cdrc{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6cqw;width:100%;margin-top:1cqw}
.cdrc .cdbtn{flex-direction:column;padding:2.2cqw 1cqw;font-size:2.4cqw}
.cdrc .i{width:3.6cqw;height:3.6cqw}
.cdpip{position:fixed;left:252px;bottom:20px;width:340px;z-index:55;background:#0B1116;border-radius:14px;padding:6px 8px 8px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.cdpiphead{display:flex;align-items:center;gap:6px;color:#C9D6DD;font-size:12px;font-weight:700;padding:0 0 6px}
.cdpiphead .i{width:14px;height:14px}
.cdpiphead .spacer{flex:1}
.cdpiphead .iconbtn{width:24px;height:24px;color:#C9D6DD;background:transparent;border-color:#2A3B47}
.cdfield{font:700 3.6cqw/1 var(--mono);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);border-radius:1.4cqw;padding:1.8cqw 3cqw;display:flex;align-items:center;gap:.4cqw}.cdfield i{width:.3cqw;height:4cqw;background:#FFA350;animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
.rcyrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto 64px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rcyrow small{display:block;color:var(--muted);font-size:11.5px}
.rcyrow .qty input{width:44px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px;background:var(--surface);color:var(--ink);font:700 14px var(--mono)}
.rcytot{display:flex;justify-content:space-between;font-weight:800;font-size:16px;padding-top:4px}
@media (max-width:560px){.rcyrow{grid-template-columns:minmax(0,1fr) auto 60px}.rcyrow .quick{grid-column:1/-1;order:5}}
.rcpick{display:flex;flex-direction:column;gap:8px;margin-top:12px;align-items:flex-start}
/* digital receipt */
.phone{width:260px;max-width:100%;border:8px solid #0B1116;border-radius:30px;background:#F2F5F6;color:#14212A;padding:10px 10px 14px;display:flex;flex-direction:column;gap:8px;font-size:12px}
.phtop{width:70px;height:6px;border-radius:3px;background:#0B1116;align-self:center}
.phmsg{align-self:flex-start;max-width:92%;background:#E3E8EB;border-radius:14px 14px 14px 4px;padding:7px 10px;font-size:11.5px;line-height:1.35;overflow-wrap:anywhere}
.phmsg small{display:block;font-weight:800;color:#5A6B76;font-size:10px}
.phmsg.mail{align-self:stretch;border-radius:10px;max-width:none}
.erc{background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.erchead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;margin-bottom:6px}
.erchead img{width:28px;height:28px;object-fit:contain}
.erchead small{color:#5A6B76;font-size:10.5px}
.erl{display:flex;justify-content:space-between;gap:8px;font-size:11.5px}
.erl span{min-width:0}
.erl.sub{color:#5A6B76}
.erl.tot{font-weight:800;font-size:14px;border-top:1px dashed #DCE3E7;padding-top:4px;margin-top:2px}
.ersave{background:#E6F6EE;color:#1E9360;font-weight:800;border-radius:8px;padding:5px 8px;text-align:center;font-size:11.5px}
.ercode{text-align:center;margin-top:6px}.ercode small{color:#5A6B76;font-size:10px}
.eroffer{background:#FFF1E4;color:#B8520A;border-radius:8px;padding:6px 8px;font-weight:700;font-size:11.5px;display:flex;gap:6px;align-items:center}
.eroffer .i{width:14px;height:14px;flex:none}
.errate{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700}.errate span{color:#F07A1C;letter-spacing:2px}
.erfoot{color:#5A6B76;font-size:10px;text-align:center}
.erwrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start}
/* stores */
.storegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.storecard{display:flex;flex-direction:column;gap:10px;min-width:0}
.storecard.here{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.storecard .vav{width:36px;height:36px;font-size:12px;flex:none}
.storekpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.storekpi b{font:800 20px/1.1 var(--display);display:block}.storekpi small{color:var(--muted);font-size:11.5px}
.trsteps{display:flex;gap:3px;flex-wrap:wrap}.trsteps span{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted)}.trsteps span.on{background:var(--ok-soft);color:var(--ok)}
.storepill .vav{border-radius:7px;font-size:10px}
@media (max-width:1100px){.cdgrid{grid-template-columns:1fr}}
@media (max-width:820px){.cdpip{left:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(300px,calc(100% - 24px))}.storepill small{display:none}}
@media (max-width:640px){.erwrap{grid-template-columns:1fr}.erwrap .phone{justify-self:center}.cdframe{padding:8px;border-radius:14px}}
</style>

const buyOptions = item => [null, ...item.deals].map(d => ({deal:d, vd:{...item.vendor, deal:d}}));
function optionPlans(item, fixedQ){ return buyOptions(item).map(o => ({...o, pl:planFor(item, o.vd, fixedQ)})); }
const bestOption = plans => plans.reduce((a,b)=> b.pl.eff < a.pl.eff-0.005 ? b : a);
const dealText = d => !d ? 'No deal' : d.k==='free' ? `Buy ${d.buy} cases, get ${d.get} free` : d.k==='extra' ? `Buy ${d.buy} cases, the next case is ${d.pct}% off` : d.k==='tier' ? `${d.pct}% off every case at ${d.min}+ cases` : `$${d.off.toFixed(2)} off every case at ${d.min}+ cases`;
function evalDeal(vd, q){ // q = cases you pay full price for
  const d=vd.deal; let paid=q*vd.cost, got=q, note='';
  if (d && d.k==='free'){ const f=Math.floor(q/d.buy)*d.get; got+=f; if (f) note=`+${f} free`; }
  if (d && d.k==='extra'){ const g=Math.floor(q/d.buy); if (g){ got+=g; paid+=g*vd.cost*(1-d.pct/100); note=`+${g} at ${d.pct}% off`; } }
  if (d && d.k==='tier' && q>=d.min){ paid*=1-d.pct/100; note=`${d.pct}% off`; }
  if (d && d.k==='amt' && q>=d.min){ paid-=q*d.off; note=`$${d.off.toFixed(2)} off per case`; }
  return {q, paid, got, eff:paid/got, note};
}
function planFor(item, vd, fixedQ){
  const extraDays = pl => (pl.got-item.need)/item.daily;
  if (fixedQ!=null){ const pl=evalDeal(vd, Math.max(fixedQ, vd.min)); pl.extra=Math.max(0,extraDays(pl)); return pl; }
  let best=null, bestDeal=null;
  for (let q=Math.max(1,vd.min); q<=item.need+15; q++){
    const pl=evalDeal(vd,q); if (pl.got<item.need) continue; pl.extra=extraDays(pl);
    if (!bestDeal || pl.eff<bestDeal.eff-0.005) bestDeal=pl;              // cheapest per case, ignoring overstock
    if (pl.extra<=30 && (!best || pl.eff<best.eff-0.005)) best=pl;       // cheapest per case within 30 days of stock
  }
  if (!best) best=evalDeal(vd, Math.max(item.need, vd.min));
  best.trap = bestDeal && bestDeal.eff<best.eff-0.005 ? bestDeal : null;
  return best;
}

function renderRail(){
  let last='', html = `<div class="brand"><img src="${MARK}" alt=""><div><b>BEVNETIC</b><small>Automated sales systems</small></div></div>`;
  for (const [id,label,icon,grp] of ROUTES){
    if (!allowed(id)) continue;
    if (grp!==last){ html += `<div class="navlabel">${grp}</div>`; last=grp; }
    const cnt = id==='alerts' ? `<span class="cnt">${openAlerts()}</span>` : id==='devices' && S.queue.length ? `<span class="cnt">${S.queue.length}</span>` : '';
    html += `<a class="nav ${S.route===id?'on':''}" href="#${id}" data-go="${id}">${ic(icon)}<span>${label}</span>${cnt}</a>`;
  }
  html += `<div class="railfoot"><strong>${esc(S.settings.name)}</strong>${esc(curStore().city)}, CA · ${curStore().lanes} lanes · ${STORES.length} stores<br>POC build · demo data</div>`;
  $('#rail').innerHTML = html;
}
function renderTop(){
  const [t,sub0] = TITLES[S.route], st=curStore(), sub=sub0.replace('Oak Street Liquor #014', st.n).replace('Lane 1', 'Lane 1 · '+st.short);
  const net = S.online
    ? `<button class="pill" data-act="net" title="Simulate an internet outage">${'<span class="dot"></span>'}Online · synced</button>`
    : `<button class="pill off" data-act="net" title="Restore connection">${'<span class="dot"></span>'}Offline · ${S.queue.length} queued</button>`;
  $('#top').innerHTML = `<div><h1>${t}</h1><div class="sub">${sub}</div></div><span class="spacer"></span>
    <button class="userpill storepill" data-act="storepick" title="Switch store">${`<span class="vav" style="background:${st.color}">${st.id}</span>`}${esc(st.short)}<small>· ${STORES.length} stores</small></button>
    ${(()=>{ const u=USERS.find(x=>x.n===S.user); return u?`<button class="userpill" data-act="signin" title="Switch user or lock">${`<span class="vav" style="background:${u.color}">${initials(u.n)}</span>`}${u.n}<small>· ${u.role}</small></button>`:''; })()}
    ${net}
    <button class="btn demo sm" data-tour="start" title="Guided product demo">${ic('play','style="width:14px;height:14px"')}<span>${S.tour!=null?'Restart demo':'Demo'}</span></button>
    <button class="iconbtn" data-go="alerts" aria-label="Notifications">${ic('bell')}<span class="badge">${openAlerts()}</span></button>
    <button class="iconbtn" data-act="notes" aria-pressed="${S.notes}" title="Show wireframe notes" aria-label="Wireframe notes">${ic('notes')}</button>
    <button class="iconbtn" data-act="theme" title="Switch theme" aria-label="Switch theme">${ic(isDark()?'sun':'moon')}</button>`;
}
function isDark(){ const t=document.documentElement.dataset.theme; return t ? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function spec(){
  const n = NOTES[S.route];
  return `<section class="spec" aria-label="Wireframe notes"><h3>${ic('notes')}Wireframe notes · ${n.deck}</h3>
    <div><b>Purpose</b>${n.purpose}</div>
    <div><b>Data on screen</b><ul>${n.data.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div><b>Build notes</b><ul>${n.build.map(x=>`<li>${x}</li>`).join('')}</ul></div></section>`;
}
function render(){
  document.body.classList.toggle('notes', S.notes);
  renderRail(); renderTop();
  $('#view').innerHTML = allowed(S.route) ? spec() + VIEWS[S.route]() : `<section class="card" style="max-width:520px;display:flex;flex-direction:column;gap:12px;align-items:flex-start">${ic('lock','style="width:32px;height:32px;color:var(--warn)"')}<h2 style="font-size:20px">A manager needs to open this</h2><div class="muted">You’re signed in as ${esc(S.user)} (${USERS.find(x=>x.n===S.user)?.role||''}). This screen needs a manager or owner.</div><button class="btn primary" data-act="signin">Switch user</button></section>`;
  if (S.route==='forecast') drawForecast();
  renderTour();
}
function go(r){ S.route=r; try{localStorage.setItem('bev-route',r)}catch(e){} render(); window.scrollTo(0,0); }
let toastT; function toast(msg, icon='check'){ const t=$('#toast'); t.innerHTML = ic(icon)+esc(msg); t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }

/* ------------------------------------------------ helpers */
function sparkPath(arr,w=160,hgt=34){ const mx=Math.max(...arr), mn=Math.min(...arr); const sx=w/(arr.length-1);
  const pts=arr.map((v,i)=>[i*sx, hgt-3-((v-mn)/(mx-mn||1))*(hgt-8)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  return {line, area: line+`L${w} ${hgt}L0 ${hgt}Z`, end:pts[pts.length-1]}; }
function spark(arr,color='var(--accent)'){ const s=sparkPath(arr);
  return `<svg class="spark" viewBox="0 0 160 34" preserveAspectRatio="none" aria-hidden="true"><path d="${s.area}" fill="${color}" opacity=".12"/><path d="${s.line}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${s.end[0]}" cy="${s.end[1]}" r="2.6" fill="${color}"/></svg>`; }
let BID=0;
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); const f=v=>Math.max(0,Math.min(255,v+amt)); return '#'+[f(n>>16),f((n>>8)&255),f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join(''); }
function lum(hex){ const n=parseInt(hex.slice(1),16); return (0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255; }

function byId(id){ return PRODUCTS.find(p=>p.id===id); }
function offerOn(id){ return OFFERS.find(o=>o.id===id && o.status==='Active'); }
function offerFor(p){ return p.cat==='Wine' ? offerOn('wine6') : p.id==='bud12' ? offerOn('bud2') : (p.id==='casa750'||p.id==='limes') ? offerOn('marg') : null; }
function offerHits(){ // what the promotion engine would apply to the current cart
  const hits=[], q=id=>S.cart.find(l=>l.id===id)?.qty||0;
  if (offerOn('wine6')){ const w=S.cart.filter(l=>byId(l.id).cat==='Wine'); if (w.reduce((a,l)=>a+l.qty,0)>=6) hits.push({n:'Mix 6 wines · 10% off', amt:w.reduce((a,l)=>a+byId(l.id).p*l.qty*(1-(l.disc||0)/100),0)*0.10}); }
  if (offerOn('bud2')){ const k=Math.floor(q('bud12')/2); if (k) hits.push({n:`Bud Light 2 for $24${k>1?' ×'+k:''}`, amt:k*(2*12.99-24)}); }
  if (offerOn('marg')){ const k=Math.min(q('casa750'),q('limes')); if (k) hits.push({n:'Margarita bundle · free limes', amt:k*1.49}); }
  return hits;
}
function totals(){
  let sub=0, crv=0, line=0, txb=0;
  for (const l of S.cart){ const p=byId(l.id); sub+=p.p*l.qty; crv+=p.crv*l.qty; if (l.disc) line+=p.p*l.qty*l.disc/100; if (taxable(p)) txb+=p.p*l.qty*(1-(l.disc||0)/100); }
  const offers=offerHits(), off=offers.reduce((a,o)=>a+o.amt,0), after=sub-off-line;
  const tdisc = !S.tdisc ? 0 : S.tdisc.kind==='%' ? after*S.tdisc.v/100 : Math.min(S.tdisc.v, after);
  const disc = S.member ? (after-tdisc)*0.05 : 0, net=after-tdisc-disc, tax=net*(sub-line>0 ? txb/(sub-line) : 0)*TAX;
  const gross = net+crv+tax, credit = Math.min(S.credit||0, gross);
  // bottle-return refund is a payment back to the customer, applied after tax like store credit
  const rcyAmt = S.recyc ? S.recyc.amt : 0, rcy = Math.min(rcyAmt, gross-credit);
  return {sub, crv, offers, off, line, tdisc, disc, tax, credit, rcy, rcyLeft:rcyAmt-rcy, total:gross-credit-rcy, saved:off+line+tdisc+disc};
}

function series(f){ // deterministic demo series, today = Fri Sep 25 2026
  let seed = f.base*97; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  const pts=[]; const start = new Date(2026,7,28); // Aug 28
  for (let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const dow=d.getDay();
    const m = (dow===5||dow===6) ? f.wk : dow===0 ? 1.25 : 1; const heat = (i>=28&&i<=31)?1.18:1;
    const v = f.base*m*heat*(0.85+rnd()*0.3)*(1+i*0.002); pts.push({d, v:Math.round(v*10)/10, fc:i>=28}); }
  return pts;
}
function reco(f){ const s=series(f).filter(p=>p.fc); let stock=f.stock, days=0;
  for (const p of s){ if (stock-p.v<0) break; stock-=p.v; days++; }
  const week = Math.round(s.slice(0,7).reduce((a,p)=>a+p.v,0));
  const need = Math.max(0, Math.round(s.slice(0,f.lead+7).reduce((a,p)=>a+p.v,0)*1.2) - f.stock);
  const cases = Math.ceil(need/f.pack), qty = cases*f.pack;
  const DOW = ['Friday','Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday'];
  const by = days - f.lead - 1 <= 0 ? 'today' : DOW[days-f.lead-1] || 'next week';
  return {days, week, qty, cases, by};
}
function drawForecast(){
  const f = FC[S.fc], pts = series(f), W=760, H=280, L=40, R=16, T=14, B=34;
  const mx = Math.max(...pts.map(p=>p.v*1.2)), step = mx>60?20:mx>20?10:mx>8?4:2, top=Math.ceil(mx/step)*step;
  const x = i => L + i*(W-L-R)/(pts.length-1), y = v => T + (1-v/top)*(H-T-B);
  let g=''; for (let v=0; v<=top; v+=step) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`;
  const hist = pts.filter(p=>!p.fc), fi = pts.findIndex(p=>p.fc);
  const hp = hist.map((p,i)=>(i?'L':'M')+x(i)+' '+y(p.v)).join('');
  const fpts = pts.slice(fi-1);
  const fp = fpts.map((p,i)=>(i?'L':'M')+x(fi-1+i)+' '+y(p.v)).join('');
  const spread = j => j ? 0.12 + j*0.008 : 0;
  const band = fpts.map((p,j)=>(j?'L':'M')+x(fi-1+j)+' '+y(p.v*(1+spread(j)))).join('')
    + fpts.map((p,j)=>[p,j]).reverse().map(([p,j])=>'L'+x(fi-1+j)+' '+y(p.v*(1-spread(j)))).join('') + 'Z';
  // day the current stock runs out, from the same forecast
  const out = reco(f).days, ox = fi+out < pts.length ? x(fi+out) : null;
  const outMark = ox==null ? '' : `<line x1="${ox}" x2="${ox}" y1="${T}" y2="${H-B}" stroke="var(--crit)" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="${ox-44}" y="${T}" width="88" height="18" rx="4" fill="var(--crit)"/><text x="${ox}" y="${T+12.5}" text-anchor="middle" style="fill:#fff;font-weight:600">Out of stock</text>`;
  let xl=''; pts.forEach((p,i)=>{ if (i%7===0 || i===fi) xl+=`<text x="${x(i)}" y="${H-12}" text-anchor="middle" ${i===fi?'style="fill:var(--ink);font-weight:600"':''}>${i===fi?'Today':p.d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</text>`; });
  $('#chart').innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily unit sales and forecast for ${esc(f.n)}" style="min-width:560px">
    ${g}<rect x="${x(fi)}" y="${T}" width="${W-R-x(fi)}" height="${H-T-B}" fill="var(--violet)" opacity=".04"/>
    <line x1="${x(fi)}" x2="${x(fi)}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3"/>
    <path d="${band}" fill="var(--violet)" opacity=".14"/>
    <path d="${hp}" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
    <path d="${fp}" fill="none" stroke="var(--violet)" stroke-width="2" stroke-dasharray="5 4"/>
    ${outMark}
    <circle cx="${x(fi-1)}" cy="${y(hist[hist.length-1].v)}" r="3.5" fill="var(--ink)"/>
    ${xl}</svg>`;
}

function journal(e){

}

function tourStep(i){

  if (st.set) st.set();
  go(st.r);

  clearTimeout(tourStep.t); tourStep.t = setTimeout(()=>tourHighlight(true), st.delay||80);
}
function tourHighlight(scroll){

  if (e.target.id==='ns-mgr' || e.target.id==='ns-copy'){ S.ns[e.target.id.slice(3)]=e.target.value; return; }
  if (e.target.id && e.target.id.startsWith('np-') && S.np){ const k=e.target.id.slice(3); S.np[k]=e.target.value;
    if (k==='price') S.np.priceEdited = e.target.value!=='';
    npRerender(); return; }
  if (e.target.id && e.target.id.startsWith('cnt-') && S.cnt){ S.cnt.lines[+e.target.id.slice(4)].c = e.target.value; render(); return; }
  if (e.target.id && e.target.id.startsWith('st-')){ const k=e.target.id.slice(3); S.settings[k]=e.target.value; { const cs=curStore(); if (['name','addr','phone','lic','tax'].includes(k)) cs[k] = k==='tax' ? +e.target.value : e.target.value; }
    if (k==='tax'){ const v=+e.target.value; if (v>=0 && v<=20){ TAX=v/100; toast(`Sales tax set to ${v.toFixed(2)}% · applies to the next sale`); } }
    else toast('Saved'); render(); return; }
  if (e.target.id && e.target.id.startsWith('role-')){ const u=USERS[+e.target.id.slice(5)]; u.role=e.target.value; render(); toast(`${u.n} is now ${u.role}`); return; }
  if (e.target.id && e.target.id.startsWith('nv-') && S.nv){ S.nv[e.target.id.slice(3)]=e.target.value; return; }
  if (e.target.id==='rp-day' && e.target.value){ S.rp.day=e.target.value; render(); return; }
  if (e.target.id==='rp-from' && e.target.value){ S.rp.from=e.target.value; render(); return; }
  if (e.target.id==='rp-to' && e.target.value){ S.rp.to=e.target.value; render(); return; }
  if (e.target.id && e.target.id.startsWith('tm-')){ const k=e.target.id.slice(3), v=Math.max(5,Math.min(80,+e.target.value||0)); S.itemMargin[k]=v; delete S.priceEdit[k]; S.priceSel=null; render(); toast(`${byId(k).n} will use ${v}% from now on`); return; }
  if (e.target.id && e.target.id.startsWith('tgt-')){ const k=e.target.id.slice(4), v=Math.max(5,Math.min(80,+e.target.value||0)); S.margins[k]=v; S.priceEdit={}; S.priceSel=null; render(); toast(`Target margin set to ${v}% · suggestions updated`); return; }
  if (e.target.id && e.target.id.startsWith('pr-')){ const k=e.target.id.slice(3), v=+e.target.value; if (v>0){ S.priceEdit[k]=Math.round(v*100)/100; S.priceSel[k]=true; } render(); return; }
  if (e.target.id==='pricefile' && e.target.files.length){ toast(`Reading ${e.target.files[0].name}… new costs will appear in the list`,'spark'); return; }
  if (e.target.id==='dealfile' && e.target.files.length){ SHEET.file = e.target.files[0].name; startDealRead(); return; }
  if (e.target.id==='man-dob'){ S.man.dob=e.target.value; manUpdate(); return; }
  if (e.target.id==='man-type'){ S.man.type=e.target.value; return; }
  if (e.target.id==='dm-target'){ S.dm.target=e.target.value; S.pinOk=false; discModal(); return; }
  if (e.target.id==='ob-target'){ S.ob.target=e.target.value; render(); return; }
  if (e.target.id==='ob-start'){ S.ob.start=e.target.value; return; }
  if (e.target.id==='ob-end'){ S.ob.end=e.target.value; return; }
  if (e.target.id==='dm-pid'){ S.dmg.pid=e.target.value; render(); return; }
  if (e.target.id==='dm-where'){ S.dmg.where=e.target.value; return; }
  if (e.target.id==='dm-photo' && e.target.files[0]){ S.dmg.photo=URL.createObjectURL(e.target.files[0]); render(); return; }
  if (e.target.id==='invfile' && e.target.files.length){ S.invStep=2; render(); toast('Reading '+e.target.files[0].name+'…','spark'); let s=2; const t=setInterval(()=>{ s++; S.invStep=s; S.inv=INVOICE.map(l=> (l.note||!l.m||l.cost!==l.prev) ? 'review':'ok'); render(); if(s>=7) clearInterval(t); }, 550); }
});
document.addEventListener('focusin', e => { if (e.target.id && e.target.id.startsWith('np-')) S.npFocus = e.target.id; });
window.addEventListener('hashchange', () => { const r=location.hash.slice(1); if (NOTES[r] && r!==S.route) go(r); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);

render();
if (location.hash==='#demo') tourStep(0);
</script>
