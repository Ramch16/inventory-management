<!doctype html>
<html>
<head>
  <title>Data Engineer — Northwind Analytics</title>

<div id="grnhse_app">
  <h1>Apply for Senior Data Engineer at Northwind Analytics</h1>
  <form id="application_form" method="post" action="/mock/greenhouse/submit">
    <label for="first_name">First Name *</label>
    <input id="first_name" name="job_application[first_name]" required>

    <label for="last_name">Last Name *</label>
    <input id="last_name" name="job_application[last_name]" required>

    <label for="email">Email *</label>
    <input id="email" name="job_application[email]" type="email" required>

    <label for="phone">Phone</label>
    <input id="phone" name="job_application[phone]" type="tel">

    <label for="linkedin">LinkedIn Profile</label>
    <input id="linkedin" name="job_application[linkedin]" type="url">

    <label for="resume">Resume/CV *</label>
    <input id="resume" name="job_application[resume]" type="file" required>

    <label for="work_auth">Are you legally authorized to work in the United States? *</label>
    <select id="work_auth" name="job_application[work_auth]" required>
      <option value="">Please select</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>

    <label for="sponsorship">Will you now or in the future require visa sponsorship? *</label>
    <select id="sponsorship" name="job_application[sponsorship]" required>
      <option value="">Please select</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>

    <button id="submit_app" type="submit">Submit Application</button>
  </form>
</div>
