<!doctype html>
<html>
<head><title>Careers at Helios — Apply</title></head>
<body>
<h1>Apply for this position</h1>
<form method="post" action="/mock/generic/submit">
  <label for="fullname">Full name</label><input id="fullname" name="fullname" required>
  <label for="email">Email address</label><input id="email" name="email" type="email" required>
  <label for="phone">Phone number</label><input id="phone" name="phone" type="tel">
  <label for="resume">Upload your resume</label><input id="resume" name="resume" type="file" required>
  <label for="start">When can you start?</label><input id="start" name="start" type="date">
  <button type="submit">Submit application</button>
</form>
</body>
</html>
